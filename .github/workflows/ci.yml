# ============================================================================
# CI Pipeline — Wavio
# ============================================================================
# Runs on every push to dev/main and every pull request targeting dev/main.
# All jobs run in parallel — no cross-job dependencies at this stage.
#
# Status badges (add to README.md):
#   ![CI](https://github.com/<owner>/<repo>/actions/workflows/ci.yml/badge.svg?branch=dev)
# ============================================================================

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.15.1"

jobs:
  # ---------------------------------------------------------------------------
  # Type checking
  # ---------------------------------------------------------------------------

  typecheck-backend:
    name: Typecheck — Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-appointment-platform-backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai-appointment-platform-backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: npx prisma generate

      - run: pnpm run typecheck

  typecheck-frontend:
    name: Typecheck — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-appointment-platform-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai-appointment-platform-frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run typecheck

  # ---------------------------------------------------------------------------
  # Linting
  # ---------------------------------------------------------------------------

  lint-backend:
    name: Lint — Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-appointment-platform-backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai-appointment-platform-backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  lint-frontend:
    name: Lint — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-appointment-platform-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai-appointment-platform-frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

  # ---------------------------------------------------------------------------
  # Formatting — checks both projects in a single job
  # ---------------------------------------------------------------------------

  format-check:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            ai-appointment-platform-backend/pnpm-lock.yaml
            ai-appointment-platform-frontend/pnpm-lock.yaml

      # Install dependencies for both sub-projects
      - run: pnpm install --frozen-lockfile
        working-directory: ai-appointment-platform-backend

      - run: pnpm install --frozen-lockfile
        working-directory: ai-appointment-platform-frontend

      - run: pnpm run format:check
        working-directory: ai-appointment-platform-backend

      - run: pnpm run format:check
        working-directory: ai-appointment-platform-frontend

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------

  build-backend:
    name: Build — Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-appointment-platform-backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai-appointment-platform-backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Generate Prisma Client — required for the backend to compile
      - run: npx prisma generate

      - run: pnpm run build

  build-frontend:
    name: Build — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-appointment-platform-frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai-appointment-platform-frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build

  # ---------------------------------------------------------------------------
  # Prisma schema validation
  # ---------------------------------------------------------------------------

  prisma-validate:
    name: Prisma Validate
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
    defaults:
      run:
        working-directory: ai-appointment-platform-backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai-appointment-platform-backend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: npx prisma validate

  # ---------------------------------------------------------------------------
  # Security audit — checks both sub-projects
  # ---------------------------------------------------------------------------

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            ai-appointment-platform-backend/pnpm-lock.yaml
            ai-appointment-platform-frontend/pnpm-lock.yaml

      - name: Audit backend
        working-directory: ai-appointment-platform-backend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=critical

      - name: Audit frontend
        working-directory: ai-appointment-platform-frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=critical

  # ---------------------------------------------------------------------------
  # Docker Build — validates the backend Dockerfile builds successfully
  # ---------------------------------------------------------------------------

  docker-build:
    name: Docker Build — Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-appointment-platform-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ai-appointment-platform-backend
          push: false
          tags: wavio-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Tests
  # ---------------------------------------------------------------------------

  test-backend:
    name: Tests — Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-appointment-platform-backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wavio_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wavio_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai-appointment-platform-backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: npx prisma generate
      - run: npx prisma db push --skip-generate
      - run: pnpm test
      - run: pnpm test:coverage

  test-frontend:
    name: Tests — Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-appointment-platform-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai-appointment-platform-frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # ---------------------------------------------------------------------------
  # E2E — Cypress contra `vite preview` con API interceptada (ver ADR-011).
  # No requiere backend ni Postgres: los specs usan cy.intercept.
  # ---------------------------------------------------------------------------

  e2e-frontend:
    name: E2E — Frontend (Cypress, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    defaults:
      run:
        working-directory: ai-appointment-platform-frontend
    env:
      VITE_GOOGLE_CLIENT_ID: dummy-e2e-client-id
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ai-appointment-platform-frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          working-directory: ai-appointment-platform-frontend
          build: pnpm run build
          start: pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort
          wait-on: "http://127.0.0.1:4173"
          wait-on-timeout: 120
          browser: ${{ matrix.browser }}
          spec: "cypress/e2e/*.cy.ts"
          config: baseUrl=http://127.0.0.1:4173,video=true

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: ai-appointment-platform-frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ matrix.browser }}
          path: ai-appointment-platform-frontend/cypress/videos
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # E2E real — Cypress contra stack completo vivo: Postgres + Nest + vite preview
  # (ver ADR-013). Specs en cypress/e2e/real/: sin cy.intercept; crean un tenant
  # real por corrida y verifican persistencia contra la API.
  # ---------------------------------------------------------------------------
  e2e-real:
    name: E2E real — Full stack (Cypress, ${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wavio_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wavio_e2e
      # El schema de env exige que estas claves existan; los flujos E2E no las
      # usan, así que llevan valores dummy de CI (no son credenciales reales).
      JWT_SECRET: ci-e2e-real-jwt-secret
      GEMINI_API_KEY: dummy-gemini-key
      CLOUDINARY_CLOUD_NAME: dummy
      CLOUDINARY_API_KEY: dummy
      CLOUDINARY_API_SECRET: dummy
      META_WEBHOOK_VERIFY_TOKEN: dummy
      GOOGLE_CLIENT_ID: dummy-e2e-client-id
      VITE_GOOGLE_CLIENT_ID: dummy-e2e-client-id
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            ai-appointment-platform-backend/pnpm-lock.yaml
            ai-appointment-platform-frontend/pnpm-lock.yaml

      # --- Backend -----------------------------------------------------------
      - run: pnpm install --frozen-lockfile
        working-directory: ai-appointment-platform-backend

      - run: npx prisma generate
        working-directory: ai-appointment-platform-backend

      # db push y no migrate deploy: la primera migración asume tablas
      # baseline creadas previamente (ver ADR-013).
      - run: npx prisma db push --skip-generate
        working-directory: ai-appointment-platform-backend

      - run: pnpm run build
        working-directory: ai-appointment-platform-backend

      - name: Start backend
        run: nohup node dist/src/main.js > /tmp/backend-e2e.log 2>&1 &
        working-directory: ai-appointment-platform-backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/v1/health > /dev/null; then
              echo "Backend healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Backend no respondió:"
          cat /tmp/backend-e2e.log
          exit 1

      # --- Frontend + Cypress ------------------------------------------------
      - run: pnpm install --frozen-lockfile
        working-directory: ai-appointment-platform-frontend

      - name: Cypress run (backend real)
        uses: cypress-io/github-action@v6
        with:
          working-directory: ai-appointment-platform-frontend
          build: pnpm run build
          start: pnpm exec vite preview --host 127.0.0.1 --port 4173 --strictPort
          wait-on: "http://127.0.0.1:4173"
          wait-on-timeout: 120
          browser: ${{ matrix.browser }}
          config-file: cypress.config.real.mjs
          config: baseUrl=http://127.0.0.1:4173,video=true

      - name: Backend log
        if: failure()
        run: cat /tmp/backend-e2e.log

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-real-screenshots-${{ matrix.browser }}
          path: ai-appointment-platform-frontend/cypress/screenshots
          if-no-files-found: ignore

      - name: Upload videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-real-videos-${{ matrix.browser }}
          path: ai-appointment-platform-frontend/cypress/videos
          if-no-files-found: ignore
